name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        run: curl -fsSL https://nsh.dev/install.sh | sh
      - name: Type check
        working-directory: app
        run: nsh check
