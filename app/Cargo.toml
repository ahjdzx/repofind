[package]
name = "nsh-app-repofind"
version = "0.2.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.0"

# 本地 embedding 推理和模型下载: 浏览器和 Intel Mac 上没有 (ONNX Runtime 没有预编译库), 条件和 build.rs 一致
[target.'cfg(not(any(target_arch = "wasm32", all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "api-24", "download-binaries", "tls-native"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
ndarray = "0.17.2"
ureq = "3"
